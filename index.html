<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第五人格賽事對局表格生成器</title>
    <!-- 引入 Tailwind CSS 作為控制面板樣式框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 modern-screenshot (原生 SVG foreignObject 渲染核心，徹底解決 html2canvas 文字下沉與線條偏移問題) -->
    <script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.0/dist/index.js"></script>
    <!-- 引入 html2canvas 作為備援匯出引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- 引入 Google Fonts 確保中英文字體美觀與跨平台一致 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-serif: 'Noto Serif TC', "PMingLiU", "SimSun", serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #f1f5f9;
            color: #0f172a;
        }

        /* 匯出畫布與表格專用精確樣式，避免 Tailwind 預設重置干擾表格邊框 */
        #export-wrapper {
            background-color: #ffffff;
            display: inline-block;
            box-sizing: border-box;
            transform-origin: top center;
        }

        .match-table {
            width: 820px;
            border-collapse: collapse;
            table-layout: fixed;
            box-sizing: border-box;
            line-height: 1.35;
            user-select: text;
        }

        .match-table th,
        .match-table td {
            border: 1.5px solid #000000;
            padding: 0;
            text-align: center;
            vertical-align: middle;
            word-wrap: break-word;
            overflow-wrap: break-word;
            box-sizing: border-box;
            position: relative;
        }

        /* 每個儲存格內部採用 Flex 絕對垂直與水平置中，徹底消除匯出圖片時文字偏下問題 */
        .cell-inner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            min-height: 44px;
            padding: 8px 10px;
            box-sizing: border-box;
            text-align: center;
        }

        .cell-inner-body {
            min-height: 78px;
            padding: 9px 10px;
            gap: 3px;
        }

        /* 精準自訂底線：使用獨立底線盒模型取代 CSS text-decoration: underline，絕不壓字或切字 */
        .custom-underline {
            display: inline-block;
            border-bottom: 1.5px solid currentColor;
            padding-bottom: 2px;
            line-height: 1.25;
        }

        /* 精準自訂刪除線：使用絕對定位中心線取代 CSS line-through，確保刪除線永遠位於文字正中央 */
        .custom-strike {
            position: relative;
            display: inline-block;
            line-height: 1.25;
        }
        .custom-strike::after {
            content: "";
            position: absolute;
            left: -2px;
            right: -2px;
            top: 50%;
            height: 1.5px;
            background-color: currentColor;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* 經典粉綠亮色主題（對應參考圖2） */
        .theme-classic {
            background-color: #ffffff;
            color: #000000;
            font-family: var(--font-sans);
        }
        .theme-classic th,
        .theme-classic td {
            border-color: #000000;
        }
        .theme-classic .header-date {
            background-color: #d3d3d3;
            color: #000000;
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .theme-classic .header-team-a {
            background-color: #d59ba6;
            color: #000000;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .theme-classic .header-team-b {
            background-color: #9eb48d;
            color: #000000;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .theme-classic .header-stage {
            background-color: #d3d3d3;
            color: #000000;
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 17px;
        }
        .theme-classic .half-label {
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 17px;
            line-height: 1.25;
        }
        .theme-classic .footer-winner {
            font-size: 20px;
            font-weight: 500;
        }
        .theme-classic .footer-score {
            font-size: 18px;
            font-weight: 500;
        }
        .theme-classic .score-cell {
            font-size: 17px;
            font-weight: 500;
        }

        /* 黑底白字深色賽事主題（對應參考圖1） */
        .theme-dark {
            background-color: #1c1c1c;
            color: #ffffff;
            font-family: var(--font-serif);
        }
        .theme-dark th,
        .theme-dark td {
            border-color: #d4d4d4;
            background-color: #1c1c1c;
            color: #ffffff;
        }
        .theme-dark .header-date {
            font-family: var(--font-sans);
            font-weight: 900;
            font-size: 32px;
            letter-spacing: 1px;
            padding: 16px 8px;
        }
        .theme-dark .header-team-a,
        .theme-dark .header-team-b {
            font-family: var(--font-sans);
            font-weight: 900;
            font-size: 40px;
            letter-spacing: 1px;
            padding: 16px 8px;
        }
        .theme-dark .header-stage {
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 20px;
        }
        .theme-dark .half-label {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 4px;
        }
        .theme-dark .score-cell {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: 18px;
        }
        .theme-dark .footer-winner {
            font-family: var(--font-sans);
            font-size: 38px;
            font-weight: 900;
            padding: 14px;
        }
        .theme-dark .footer-score {
            font-family: var(--font-sans);
            font-size: 20px;
            font-weight: 800;
        }

        /* 精準底線與刪除線樣式（避免原生 text-decoration 貫穿中文字體） */
        .custom-underline {
            border-bottom: 1.5px solid currentColor;
            padding-bottom: 2px;
            display: inline-block;
            line-height: 1.15;
        }
        .custom-strike {
            position: relative;
            display: inline-block;
            line-height: 1.2;
        }
        .custom-strike .strike-line {
            position: absolute;
            left: -2px;
            right: -2px;
            top: 52%;
            height: 1.5px;
            background-color: currentColor;
            pointer-events: none;
        }

        /* 畫布內可直接點擊編輯的樣式提示 */
        [contenteditable="true"] {
            outline: none;
            border-radius: 2px;
            transition: background-color 0.15s ease;
        }
        [contenteditable="true"]:hover {
            background-color: rgba(59, 130, 246, 0.12);
        }
        [contenteditable="true"]:focus {
            background-color: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }

        /* 匯出時移除所有編輯框輔助視覺 */
        .exporting [contenteditable="true"]:hover,
        .exporting [contenteditable="true"]:focus {
            background-color: transparent !important;
            box-shadow: none !important;
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽與工具列 -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-3 h-6 bg-indigo-500 rounded-sm"></div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">賽事對局與 BP 表格圖片生成器</h1>
                    <p class="text-xs text-slate-400">支援左側表單輸入與右側表格直接點擊修改，一鍵匯出無裁切高畫質 PNG 圖片</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <button id="btn-load-template" type="button" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded transition">
                    載入空白預設範本
                </button>
                <button id="btn-load-demo" type="button" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded transition">
                    載入實戰範例數據
                </button>
                <button id="btn-copy-tsv" type="button" class="px-3 py-1.5 text-xs font-medium bg-emerald-800 hover:bg-emerald-700 text-emerald-100 border border-emerald-600 rounded transition">
                    複製為 Google 試算表格式 (TSV)
                </button>
                <button id="btn-download-html" type="button" class="px-3 py-1.5 text-xs font-medium bg-slate-700 hover:bg-slate-600 text-white rounded transition" title="下載此網頁原始碼，可直接上傳至 GitHub 專案庫">
                    下載 index.html (供 GitHub 部署)
                </button>
                <div class="h-5 w-[1px] bg-slate-700 mx-1 hidden sm:block"></div>
                <button id="btn-copy-img" type="button" class="px-4 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white rounded shadow transition">
                    複製圖片至剪貼簿
                </button>
                <button id="btn-export-png" type="button" class="px-4 py-2 text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white rounded shadow transition">
                    下載 PNG 圖片
                </button>
            </div>
        </div>
    </header>

    <!-- 狀態通知橫幅 -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 主內容區：左側緊湊控制面板 + 右側完整預覽區 -->
    <main class="flex-1 max-w-[1720px] w-full mx-auto p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">

        <!-- 左側：結構化資料輸入面板 (佔 4 欄，給預覽區更大空間) -->
        <section class="lg:col-span-5 xl:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col lg:max-h-[calc(100vh-76px)]">
            <!-- 面板分頁切換 -->
            <div class="bg-slate-100 border-b border-slate-200 px-3.5 py-2 flex items-center justify-between">
                <span class="text-sm font-bold text-slate-700">資料與外觀設定面板</span>
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer select-none">
                        <input type="checkbox" id="chk-auto-score" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span>自動加總局比分與總分</span>
                    </label>
                </div>
            </div>

            <!-- 可捲動表單內容 -->
            <div class="p-3.5 overflow-y-auto space-y-4 flex-1" id="form-scroll-container">

                <!-- 1. 視覺與格式偏好設定 -->
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2.5">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">表格風格與格式選項</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">配色主題</label>
                            <select id="opt-theme" class="w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white focus:outline-none focus:border-indigo-500">
                                <option value="classic">經典自訂配色版 (亮色)</option>
                                <option value="dark">深色賽事版 (黑底白字)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">半場標題格式</label>
                            <select id="opt-half-format" class="w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white focus:outline-none focus:border-indigo-500">
                                <option value="short">簡稱 (1上 / 1下)</option>
                                <option value="full">完整 (第1局上半場)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">求生禁用連接符</label>
                            <select id="opt-ban-sep" class="w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white focus:outline-none focus:border-indigo-500">
                                <option value="slash-gt">Ban:A/B&gt;C&gt;D (附圖格式)</option>
                                <option value="comma-gt">A、B&gt;C&gt;D (無Ban字樣)</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-x-4 gap-y-1.5 pt-1">
                        <label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer">
                            <input type="checkbox" id="opt-map-strike" checked class="rounded text-indigo-600">
                            <span>禁用地圖加上刪除線</span>
                        </label>
                        <label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer">
                            <input type="checkbox" id="opt-pick-underline" checked class="rounded text-indigo-600">
                            <span>選用角色加上底線</span>
                        </label>
                        <label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer">
                            <input type="checkbox" id="opt-show-empty-ban" checked class="rounded text-indigo-600">
                            <span>未輸入時顯示範本預設文字 (如 求生者 1、屠夫 等)</span>
                        </label>
                    </div>

                    <!-- 隊伍代表色與獲勝變色設定 -->
                    <div class="pt-2.5 mt-2 border-t border-slate-200 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-700">經典版隊伍代表色與獲勝底色設定</span>
                            <button type="button" id="btn-reset-colors" class="text-[11px] text-indigo-600 hover:text-indigo-800 underline">恢復預設粉綠</button>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div class="bg-white p-2 rounded border border-slate-200 flex items-center justify-between">
                                <span class="text-xs font-medium text-slate-700">隊伍 A 顏色</span>
                                <div class="flex items-center gap-1.5">
                                    <input type="color" id="opt-color-team-a" value="#d59ba6" class="w-6 h-6 rounded cursor-pointer border-0 p-0 bg-transparent">
                                    <input type="text" id="opt-color-team-a-hex" value="#d59ba6" class="w-16 text-[11px] font-mono border border-slate-300 rounded px-1 py-0.5 text-center uppercase">
                                </div>
                            </div>
                            <div class="bg-white p-2 rounded border border-slate-200 flex items-center justify-between">
                                <span class="text-xs font-medium text-slate-700">隊伍 B 顏色</span>
                                <div class="flex items-center gap-1.5">
                                    <input type="color" id="opt-color-team-b" value="#9eb48d" class="w-6 h-6 rounded cursor-pointer border-0 p-0 bg-transparent">
                                    <input type="text" id="opt-color-team-b-hex" value="#9eb48d" class="w-16 text-[11px] font-mono border border-slate-300 rounded px-1 py-0.5 text-center uppercase">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-700 mb-1">獲勝大局底色變色範圍</label>
                                <select id="opt-round-win-style" class="w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white focus:outline-none focus:border-indigo-500">
                                    <option value="row">整大局橫列皆變為勝隊底色</option>
                                    <option value="score-only">僅大局比分欄變為勝隊底色</option>
                                    <option value="side-and-score">獲勝隊伍欄位 + 大局比分變色</option>
                                    <option value="none">不變色 (維持白底)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-700 mb-1">獲勝大局底色深淺</label>
                                <select id="opt-round-win-tint" class="w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white focus:outline-none focus:border-indigo-500">
                                    <option value="1">與表頭同色 (100% 飽和度)</option>
                                    <option value="0.55">柔和同色系 (55% 飽和度)</option>
                                    <option value="0.35">清爽淺底色 (35% 飽和度)</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
                            <label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer">
                                <input type="checkbox" id="opt-winner-row-color" checked class="rounded text-indigo-600">
                                <span>底部「勝者欄」自動套用勝利隊伍底色</span>
                            </label>
                            <select id="opt-winner-color-override" class="text-xs border border-slate-300 rounded px-2 py-1 bg-white focus:outline-none focus:border-indigo-500">
                                <option value="auto">勝者底色：自動依總分/隊名判定</option>
                                <option value="A">強制套用隊伍 A 底色</option>
                                <option value="B">強制套用隊伍 B 底色</option>
                                <option value="none">維持白底</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 2. 表頭與全域賽事資訊 -->
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2.5">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">表頭與勝負結果 (留空時自動顯示範本標題)</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">左上欄位 (日期/時間)</label>
                            <input type="text" id="inp-date" class="w-full text-xs border border-slate-300 rounded px-2 py-1.5 focus:outline-none focus:border-indigo-500" placeholder="日期">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">右上欄位 (賽制/比分)</label>
                            <input type="text" id="inp-stage" class="w-full text-xs border border-slate-300 rounded px-2 py-1.5 focus:outline-none focus:border-indigo-500" placeholder="常規 or 決賽">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">隊伍 A 名稱</label>
                            <input type="text" id="inp-team-a" class="w-full text-xs border border-slate-300 rounded px-2 py-1.5 focus:outline-none focus:border-indigo-500" placeholder="隊伍 A">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">隊伍 B 名稱</label>
                            <input type="text" id="inp-team-b" class="w-full text-xs border border-slate-300 rounded px-2 py-1.5 focus:outline-none focus:border-indigo-500" placeholder="隊伍 B">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 pt-1">
                        <div class="sm:col-span-7">
                            <label class="block text-xs font-medium text-slate-700 mb-1">底部獲勝隊伍顯示</label>
                            <div class="flex gap-1">
                                <input type="text" id="inp-winner" class="flex-1 min-w-0 text-xs border border-slate-300 rounded px-2 py-1.5 focus:outline-none focus:border-indigo-500" placeholder="自動依總分判定或手動輸入">
                                <button type="button" id="btn-win-a" class="px-2 py-1 text-xs bg-rose-100 hover:bg-rose-200 text-rose-900 rounded border border-rose-300 transition whitespace-nowrap">隊伍A</button>
                                <button type="button" id="btn-win-b" class="px-2 py-1 text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-900 rounded border border-emerald-300 transition whitespace-nowrap">隊伍B</button>
                            </div>
                        </div>
                        <div class="sm:col-span-5">
                            <label class="block text-xs font-medium text-slate-700 mb-1">最終總比分 (A : B)</label>
                            <div class="flex items-center gap-1">
                                <input type="text" id="inp-final-a" class="w-full text-center text-xs border border-slate-300 rounded px-1.5 py-1.5 focus:outline-none focus:border-indigo-500" placeholder="A">
                                <span class="text-xs font-bold text-slate-500">:</span>
                                <input type="text" id="inp-final-b" class="w-full text-center text-xs border border-slate-300 rounded px-1.5 py-1.5 focus:outline-none focus:border-indigo-500" placeholder="B">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. 各局詳細資料動態表單區 -->
                <div class="space-y-2.5">
                    <div class="flex items-center justify-between">

        // 格式化監管者選角字串（採用 custom-underline 確保匯出圖片時底線絕不切字）
        function formatHunterPick(half) {
            const rawPick = (half.hunterPick || '').trim();
            const pick = rawPick !== '' ? rawPick : (appState.settings.showEmptyStructure ? '屠夫' : '');
            const player = half.hunterPlayer ? `（${half.hunterPlayer}）` : '';
            if (appState.settings.pickUnderline && pick) {
                return `<span class="custom-underline">${escapeHtml(pick)}</span>${escapeHtml(player)}`;
            }
            return `${escapeHtml(pick)}${escapeHtml(player)}`;
        }

        // 將十六進位顏色與白色依指定比例混合，產生柔和底色
        function blendHexWithWhite(hex, ratio) {
            const cleanHex = (hex || '#ffffff').replace('#', '');
            if (cleanHex.length !== 6) return hex;
            const r = parseInt(cleanHex.substring(0, 2), 16);
            const g = parseInt(cleanHex.substring(2, 4), 16);
            const b = parseInt(cleanHex.substring(4, 6), 16);
            const alpha = parseFloat(ratio);
            if (isNaN(alpha) || alpha >= 0.99) return `#${cleanHex}`;
            const mixR = Math.round(r * alpha + 255 * (1 - alpha));
            const mixG = Math.round(g * alpha + 255 * (1 - alpha));
            const mixB = Math.round(b * alpha + 255 * (1 - alpha));
            return `rgb(${mixR}, ${mixG}, ${mixB})`;
        }

        // 判定單一大局的獲勝隊伍 ('A' | 'B' | null)
        function getRoundWinner(round) {
            if (round.roundWinnerOverride === 'A') return 'A';
            if (round.roundWinnerOverride === 'B') return 'B';
            if (round.roundWinnerOverride === 'none') return null;

            const scoreA = parseFloat(round.roundScoreA);
            const scoreB = parseFloat(round.roundScoreB);
            if (!isNaN(scoreA) && !isNaN(scoreB)) {
                if (scoreA > scoreB) return 'A';
                if (scoreB > scoreA) return 'B';
            }
            return null;
        }

        // 判定整場比賽最終勝者所屬隊伍 ('A' | 'B' | null)
        function getMatchWinnerSide() {
            const override = appState.settings.winnerColorOverride;
            if (override === 'A') return 'A';
            if (override === 'B') return 'B';
            if (override === 'none') return null;

            const wText = (appState.footer.winner || '').trim();
            const tA = (appState.header.teamA || '').trim();
            const tB = (appState.header.teamB || '').trim();

            if (wText !== '' && wText !== '勝者') {
                if (tA !== '' && wText === tA) return 'A';
                if (tB !== '' && wText === tB) return 'B';
                if (wText === '隊伍 A') return 'A';
                if (wText === '隊伍 B') return 'B';
            }

            const finalA = parseFloat(appState.footer.finalScoreA);
            const finalB = parseFloat(appState.footer.finalScoreB);
            if (!isNaN(finalA) && !isNaN(finalB)) {
                if (finalA > finalB) return 'A';
                if (finalB > finalA) return 'B';
            }
            return null;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-700' : (type === 'error' ? 'bg-rose-700' : 'bg-slate-800');
            toast.className = `${bgClass} text-white text-xs font-medium px-4 py-2.5 rounded-lg shadow-lg transition-opacity duration-300 pointer-events-auto`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        // 自動計算各局比分與總比分
        function recalculateScoresIfNeeded() {
            if (!appState.settings.autoCalculateScore) return;

            let totalA = 0;
            let totalB = 0;
            let hasAnyValidScore = false;

            appState.rounds.forEach(round => {
                const h1A = parseInt(round.halves[0].scoreA, 10);
                const h1B = parseInt(round.halves[0].scoreB, 10);
                const h2A = parseInt(round.halves[1].scoreA, 10);
                const h2B = parseInt(round.halves[1].scoreB, 10);

                if (!isNaN(h1A) || !isNaN(h2A)) {
                    const sumA = (isNaN(h1A) ? 0 : h1A) + (isNaN(h2A) ? 0 : h2A);
                    round.roundScoreA = String(sumA);
                    totalA += sumA;
                    hasAnyValidScore = true;
                } else {
                    round.roundScoreA = '';
                }

                if (!isNaN(h1B) || !isNaN(h2B)) {
                    const sumB = (isNaN(h1B) ? 0 : h1B) + (isNaN(h2B) ? 0 : h2B);
                    round.roundScoreB = String(sumB);
                    totalB += sumB;
                    hasAnyValidScore = true;
                } else {
                    round.roundScoreB = '';
                }
            });

            if (hasAnyValidScore) {
                appState.footer.finalScoreA = String(totalA);
                appState.footer.finalScoreB = String(totalB);
            } else {
                appState.footer.finalScoreA = '';
                appState.footer.finalScoreB = '';
            }
        }

            const hasContent = picks.some(p => p && p.trim() !== '');
            if (!hasContent) {
                if (!appState.settings.showEmptyStructure) return '';
                if (half.emptyStyle === 'symbols-only') {
                    return '| | |';
                }
                return '求生者 1 | 求生者 2 | 求生者 3 | 求生者 4';
            }
            return `${picks[0] || ''} | ${picks[1] || ''} | ${picks[2] || ''} | ${picks[3] || ''}`;
        }

        // 格式化求生者禁用字串（支援未填寫時顯示範本預設文字）
        function formatSurvivorBans(half) {
            const bans = half.survivorsBan || ['', '', '', ''];
            const hasContent = bans.some(b => b && b.trim() !== '');
            if (!hasContent) {
                if (!appState.settings.showEmptyStructure) return '';
                if (half.emptyStyle === 'symbols-only') {
                    return appState.settings.banSeparator === 'slash-gt' ? 'Ban:/>>' : '、>>';
                }
                if (appState.settings.banSeparator === 'slash-gt') {
                    return 'Ban:求生者 1/求生者 2>求生者 3>求生者 4';
                } else {
                    return '求生者 1、求生者 2>求生者 3>求生者 4';
                }
            }
            const b0 = bans[0] || '';
            const b1 = bans[1] || '';
            const b2 = bans[2] || '';
            const b3 = bans[3] || '';

            if (appState.settings.banSeparator === 'slash-gt') {
                return `Ban:${b0}/${b1}>${b2}>${b3}`;
            } else {
                return `${b0}、${b1}>${b2}>${b3}`;
            }
        }

        // 格式化監管者選角字串
        function formatHunterPick(half) {
            const rawPick = (half.hunterPick || '').trim();
            const pick = rawPick !== '' ? rawPick : (appState.settings.showEmptyStructure ? '屠夫' : '');
            const player = half.hunterPlayer ? `（${half.hunterPlayer}）` : '';
            if (appState.settings.pickUnderline && pick) {
                return `<span class="custom-underline">${escapeHtml(pick)}</span>${escapeHtml(player)}`;
            }
            return `${escapeHtml(pick)}${escapeHtml(player)}`;
        }

        // 格式化監管者禁用字串
        function formatHunterBans(half, roundNumber) {
            if (!half.showHunterBanLine) return '';
            const validBans = (half.huntersBan || []).filter(b => b !== undefined);
            const nonEmptyBans = validBans.filter(b => b.trim() !== '');

            if (nonEmptyBans.length === 0) {
                if (!appState.settings.showEmptyStructure) return '';
                if (roundNumber === 2) return 'Ban:';
                if (roundNumber >= 3) return 'Ban:/';
                return 'Ban:';
            }

            if (appState.settings.banSeparator === 'slash-gt') {
                return 'Ban:' + nonEmptyBans.join('/');
            } else {
                return nonEmptyBans.join('、');
            }
        }

        // HTML 跳脫處理防止渲染破版
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // 格式化比分顯示 (如 "2:2" 或空白時僅顯示 ":")
        function formatScoreDisplay(scoreA, scoreB) {
            const a = (scoreA !== undefined && scoreA !== null) ? String(scoreA).trim() : '';
            const b = (scoreB !== undefined && scoreB !== null) ? String(scoreB).trim() : '';
            if (a === '' && b === '') return ':';
            return `${a}:${b}`;
        }

        // 動態調整預覽區縮放比例，使整張表格在螢幕中完整顯示
        function adjustPreviewScale() {
            const viewport = document.getElementById('preview-viewport');
            const wrapper = document.getElementById('export-wrapper');
            const fitCheck = document.getElementById('chk-fit-preview');
            if (!viewport || !wrapper) return;

            // 先還原原始尺寸以量測真實高度與寬度
            wrapper.style.transform = 'none';
            viewport.style.height = 'auto';

            if (!fitCheck || !fitCheck.checked || wrapper.classList.contains('exporting')) {
                return;
            }

            const availWidth = viewport.clientWidth - 24;
            const availHeight = window.innerHeight - 155;
            const naturalWidth = wrapper.offsetWidth;
            const naturalHeight = wrapper.offsetHeight;

            if (naturalWidth <= 0 || naturalHeight <= 0) return;

            const scaleW = availWidth < naturalWidth ? availWidth / naturalWidth : 1;
            const scaleH = availHeight > 360 && availHeight < naturalHeight ? availHeight / naturalHeight : 1;
            const scale = Math.min(1, scaleW, scaleH);

            if (scale < 0.995) {
                wrapper.style.transform = `scale(${scale})`;
                viewport.style.height = `${Math.ceil(naturalHeight * scale) + 24}px`;
            }
        }

        // 將右側表格內 contenteditable 的直接修改同步寫回 appState
        function bindPreviewInlineEdits() {
            const table = document.getElementById('match-table');
            table.querySelectorAll('[contenteditable="true"]').forEach(el => {
                el.addEventListener('blur', () => {
                    const key = el.dataset.edit;
                    if (!key) return;
                    const text = el.innerText.trim();

                    if (key === 'header.date') {
                        appState.header.date = text === '日期' ? '' : text;
                        document.getElementById('inp-date').value = appState.header.date;
                    } else if (key === 'header.teamA') {
                        appState.header.teamA = text === '隊伍 A' ? '' : text;
                        document.getElementById('inp-team-a').value = appState.header.teamA;
                        renderActiveRoundEditor();
                    } else if (key === 'header.teamB') {
                        appState.header.teamB = text === '隊伍 B' ? '' : text;
                        document.getElementById('inp-team-b').value = appState.header.teamB;
                        renderActiveRoundEditor();
                    } else if (key === 'header.stage') {
                        appState.header.stage = text === '常規 or 決賽' ? '' : text;
                        document.getElementById('inp-stage').value = appState.header.stage;
                    } else if (key === 'footer.winner') {
                        appState.footer.winnerManual = text !== '' && text !== '勝者';
                        appState.footer.winner = text === '勝者' ? '' : text;
                        document.getElementById('inp-winner').value = appState.footer.winner;
                    } else if (key === 'footer.finalScore') {
                        const parts = text.split(':');
                        if (parts.length === 2) {
                            appState.settings.autoCalculateScore = false;
                            document.getElementById('chk-auto-score').checked = false;
                            appState.footer.finalScoreA = parts[0].trim();
                            appState.footer.finalScoreB = parts[1].trim();
                        }
                    } else if (key.startsWith('round.')) {
                        const tokens = key.split('.');
                        const rIdx = parseInt(tokens[1], 10);
                        const round = appState.rounds[rIdx];
                        if (!round) return;

                        if (tokens[2] === 'roundScore') {
                            const parts = text.split(':');
                            if (parts.length === 2) {
                                appState.settings.autoCalculateScore = false;
                                document.getElementById('chk-auto-score').checked = false;
                                round.roundScoreA = parts[0].trim();
                                round.roundScoreB = parts[1].trim();
                            }
                        } else if (tokens[2] === 'half') {
                            const hIdx = parseInt(tokens[3], 10);
                            const field = tokens[4];
                            const half = round.halves[hIdx];
                            if (!half) return;

                            if (field === 'halfTitle') {
                                half.customHalfTitle = text;
                            } else if (field === 'mapPick') {
                                const cleaned = text.replace(/^【|】$/g, '').trim();
                                half.mapPick = cleaned === '地圖名稱' ? '' : cleaned;
                            } else if (field === 'mapBan') {
                                half.mapBan = (text === '禁用 A/禁用 B' || text === '禁用 A') ? '' : text;
                            } else if (field === 'halfScore') {
                                const parts = text.split(':');
                                if (parts.length === 2) {
                                    half.scoreA = parts[0].trim();
                                    half.scoreB = parts[1].trim();
                                }
                            } else if (field === 'survPick') {
                                const parts = text.split('|').map(s => s.trim());
                                if (parts.length === 4 && text !== '求生者 1 | 求生者 2 | 求生者 3 | 求生者 4') {
                                    half.survivorsPick = parts;
                                }
                            } else if (field === 'survBan') {
                                const noPrefix = text.replace(/^Ban:/i, '');
                                const parts = noPrefix.split(/[\/、>]/).map(s => s.trim());
                                if (parts.length === 4 && !text.includes('求生者 1')) {
                                    half.survivorsBan = parts;
                                }
                            } else if (field === 'hunterPick') {
                                if (text !== '屠夫') {
                                    const match = text.match(/^([^（(]+)(?:[（(]([^）)]*)[）)])?$/);
                                    if (match) {
                                        half.hunterPick = match[1].trim();
                                        half.hunterPlayer = (match[2] || '').trim();
                                    } else {
                                        half.hunterPick = text;
                                    }
                                }
                            } else if (field === 'hunterBan') {
                                const noPrefix = text.replace(/^Ban:/i, '').trim();
                                if (noPrefix === '' || noPrefix === '/') {
                                    half.huntersBan = ['', ''];
                                } else {
                                    const parts = noPrefix.split(/[\/、]/).map(s => s.trim());
                                    half.huntersBan = [parts[0] || '', parts[1] || ''];
                                    half.showHunterBanLine = true;
                                }
                            }
                            if (rIdx === activeRoundIndex) {
                                renderActiveRoundEditor();
                            }
                        }
                    }
                    renderPreviewTable();
                });
            });
        }

                        <div class="sm:col-span-5">
                            <label class="block text-xs font-medium text-slate-700 mb-1">禁用地圖 (可輸入 A/B)</label>
                            <input type="text" class="inp-map-ban w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.mapBan)}" placeholder="${round.roundNumber >= 3 ? '禁用 A' : '禁用 A/禁用 B'}">
                        </div>
                        <div class="sm:col-span-3">
                            <label class="block text-xs font-medium text-slate-700 mb-1">${round.roundNumber}${half.halfName}比分 (A : B)</label>
                            <div class="flex items-center gap-1">
                                <input type="text" class="inp-half-score-a w-full text-center text-xs border border-slate-300 rounded px-1.5 py-1.5 bg-white" value="${escapeHtml(half.scoreA)}" placeholder="A">
                                <span class="text-xs font-bold">:</span>
                                <input type="text" class="inp-half-score-b w-full text-center text-xs border border-slate-300 rounded px-1.5 py-1.5 bg-white" value="${escapeHtml(half.scoreB)}" placeholder="B">
                            </div>
                        </div>
                    </div>

                    <!-- 求生者選用 1~4 -->
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">選用求生者 1 ~ 4 (${escapeHtml(survTeamLabel)})</label>
                        <div class="grid grid-cols-4 gap-1.5">
                            <input type="text" data-idx="0" class="inp-surv-pick w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.survivorsPick[0] || '')}" placeholder="求生者 1">
                            <input type="text" data-idx="1" class="inp-surv-pick w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.survivorsPick[1] || '')}" placeholder="求生者 2">
                            <input type="text" data-idx="2" class="inp-surv-pick w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.survivorsPick[2] || '')}" placeholder="求生者 3">
                            <input type="text" data-idx="3" class="inp-surv-pick w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.survivorsPick[3] || '')}" placeholder="求生者 4">
                        </div>
                    </div>

                    <!-- 求生者禁用 1~4 -->
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">禁用求生者 1 ~ 4 (Ban)</label>
                        <div class="grid grid-cols-4 gap-1.5">
                            <input type="text" data-idx="0" class="inp-surv-ban w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.survivorsBan[0] || '')}" placeholder="求生者 1">
                            <input type="text" data-idx="1" class="inp-surv-ban w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.survivorsBan[1] || '')}" placeholder="求生者 2">
                            <input type="text" data-idx="2" class="inp-surv-ban w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.survivorsBan[2] || '')}" placeholder="求生者 3">
                            <input type="text" data-idx="3" class="inp-surv-ban w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.survivorsBan[3] || '')}" placeholder="求生者 4">
                        </div>
                    </div>

                    <!-- 監管者選用與禁用 -->
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 pt-1 border-t border-slate-200/80">
                        <div class="sm:col-span-4">
                            <label class="block text-xs font-medium text-slate-700 mb-1">選用監管者 (${escapeHtml(huntTeamLabel)})</label>
                            <input type="text" class="inp-hunter-pick w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.hunterPick)}" placeholder="屠夫">
                        </div>
                        <div class="sm:col-span-3">
                            <label class="block text-xs font-medium text-slate-700 mb-1">選手ID (選填)</label>
                            <input type="text" class="inp-hunter-player w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.hunterPlayer)}" placeholder="可留空">
                        </div>
                        <div class="sm:col-span-5">
                            <div class="flex items-center justify-between mb-1">
                                <label class="text-xs font-medium text-slate-700">禁用屠夫 (Ban)</label>
                                <label class="flex items-center gap-1 text-[11px] text-slate-600 cursor-pointer">
                                    <input type="checkbox" class="chk-hunter-ban-line rounded text-indigo-600" ${half.showHunterBanLine ? 'checked' : ''}>
                                    <span>顯示屠夫Ban列</span>
                                </label>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5">
                                <input type="text" class="inp-hunter-ban-1 w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.huntersBan[0] || '')}" placeholder="禁用屠夫 1">
                                <input type="text" class="inp-hunter-ban-2 w-full text-xs border border-slate-300 rounded px-2 py-1.5 bg-white" value="${escapeHtml(half.huntersBan[1] || '')}" placeholder="禁用屠夫 2">
                            </div>
                        </div>
                    </div>
                `;

                // 綁定單場半場陣營對調事件
                card.querySelector('.btn-swap-role').addEventListener('click', () => {
                    half.teamARole = half.teamARole === 'survivor' ? 'hunter' : 'survivor';
                    const tempScore = half.scoreA;
                    half.scoreA = half.scoreB;
                    half.scoreB = tempScore;
                    renderActiveRoundEditor();
                    renderPreviewTable();
                    showToast(`第 ${round.roundNumber}${half.halfName} 的左右欄內容已互換`);
                });

                // 綁定地圖與比分輸入事件
                card.querySelector('.inp-map-pick').addEventListener('input', (e) => {
                    half.mapPick = e.target.value;
                    renderPreviewTable();
                });
                card.querySelector('.inp-map-ban').addEventListener('input', (e) => {
                    half.mapBan = e.target.value;
                    renderPreviewTable();
                });
                card.querySelector('.inp-half-score-a').addEventListener('input', (e) => {
                    half.scoreA = e.target.value;
                    renderPreviewTable();
                    document.getElementById('inp-round-score-a').value = round.roundScoreA;
                });
                card.querySelector('.inp-half-score-b').addEventListener('input', (e) => {
                    half.scoreB = e.target.value;
                    renderPreviewTable();
                    document.getElementById('inp-round-score-b').value = round.roundScoreB;
                });

                // 綁定求生選角與禁用
                card.querySelectorAll('.inp-surv-pick').forEach(inp => {
                    inp.addEventListener('input', (e) => {
                        const i = parseInt(e.target.dataset.idx, 10);
                        half.survivorsPick[i] = e.target.value;
                        renderPreviewTable();
                    });
                });
                card.querySelectorAll('.inp-surv-ban').forEach(inp => {
                    inp.addEventListener('input', (e) => {
                        const i = parseInt(e.target.dataset.idx, 10);
                        half.survivorsBan[i] = e.target.value;
                        renderPreviewTable();
                    });
                });

                // 綁定監管選角與禁用
                card.querySelector('.inp-hunter-pick').addEventListener('input', (e) => {
                    half.hunterPick = e.target.value;
                    renderPreviewTable();
                });
                card.querySelector('.inp-hunter-player').addEventListener('input', (e) => {
                    half.hunterPlayer = e.target.value;
                    renderPreviewTable();
                });
                card.querySelector('.chk-hunter-ban-line').addEventListener('change', (e) => {
                    half.showHunterBanLine = e.target.checked;
                    renderPreviewTable();
                });
                card.querySelector('.inp-hunter-ban-1').addEventListener('input', (e) => {
                    half.huntersBan[0] = e.target.value;
                    if (e.target.value.trim() !== '') {
                        half.showHunterBanLine = true;
                        card.querySelector('.chk-hunter-ban-line').checked = true;
                    }
                    renderPreviewTable();
                });
                card.querySelector('.inp-hunter-ban-2').addEventListener('input', (e) => {
                    half.huntersBan[1] = e.target.value;
                    if (e.target.value.trim() !== '') {
                        half.showHunterBanLine = true;
                        card.querySelector('.chk-hunter-ban-line').checked = true;
                    }
                    renderPreviewTable();
                });

                container.appendChild(card);
            });
        }

        /**
         * 綁定全域控制列與設定事件
         */
        function bindGlobalEvents() {
            // 外觀設定變更
            document.getElementById('opt-theme').addEventListener('change', (e) => {
                appState.settings.theme = e.target.value;
                renderPreviewTable();
            });
            document.getElementById('opt-half-format').addEventListener('change', (e) => {
                appState.settings.halfFormat = e.target.value;
                renderPreviewTable();
            });
            document.getElementById('opt-ban-sep').addEventListener('change', (e) => {
                appState.settings.banSeparator = e.target.value;
                renderPreviewTable();
            });
            document.getElementById('opt-map-strike').addEventListener('change', (e) => {
                appState.settings.mapStrikethrough = e.target.checked;
                renderPreviewTable();
            });
            document.getElementById('opt-pick-underline').addEventListener('change', (e) => {
                appState.settings.pickUnderline = e.target.checked;
                renderPreviewTable();
            });
            document.getElementById('opt-show-empty-ban').addEventListener('change', (e) => {
                appState.settings.showEmptyStructure = e.target.checked;
                renderPreviewTable();
            });

            // 隊伍顏色與獲勝變色設定事件
            const colorAInput = document.getElementById('opt-color-team-a');
            const colorAHex = document.getElementById('opt-color-team-a-hex');
            const colorBInput = document.getElementById('opt-color-team-b');
            const colorBHex = document.getElementById('opt-color-team-b-hex');

            colorAInput.addEventListener('input', (e) => {
                appState.settings.teamAColor = e.target.value;
                colorAHex.value = e.target.value;
                renderPreviewTable();
            });
            colorAHex.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                    appState.settings.teamAColor = val;
                    colorAInput.value = val;
                    renderPreviewTable();
                }
            });
            colorBInput.addEventListener('input', (e) => {
                appState.settings.teamBColor = e.target.value;
                colorBHex.value = e.target.value;
                renderPreviewTable();
            });
            colorBHex.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                    appState.settings.teamBColor = val;
                    colorBInput.value = val;
                    renderPreviewTable();
                }
            });
            document.getElementById('btn-reset-colors').addEventListener('click', () => {
                appState.settings.teamAColor = '#d59ba6';
                appState.settings.teamBColor = '#9eb48d';
                colorAInput.value = '#d59ba6';
                colorAHex.value = '#d59ba6';
                colorBInput.value = '#9eb48d';
                colorBHex.value = '#9eb48d';
                renderPreviewTable();
                showToast('已恢復預設經典粉綠配色');
            });

            document.getElementById('opt-round-win-style').addEventListener('change', (e) => {
                appState.settings.roundWinHighlight = e.target.value;
                renderPreviewTable();
            });
            document.getElementById('opt-round-win-tint').addEventListener('change', (e) => {
                appState.settings.roundWinTint = e.target.value;
                renderPreviewTable();
            });
            document.getElementById('opt-winner-row-color').addEventListener('change', (e) => {
                appState.settings.winnerRowColor = e.target.checked;
                renderPreviewTable();
            });
            document.getElementById('opt-winner-color-override').addEventListener('change', (e) => {
                appState.settings.winnerColorOverride = e.target.value;
                renderPreviewTable();
            });

            document.getElementById('chk-auto-score').addEventListener('change', (e) => {
                appState.settings.autoCalculateScore = e.target.checked;
                renderPreviewTable();
                renderActiveRoundEditor();
            });

            document.getElementById('chk-fit-preview').addEventListener('change', () => {
                adjustPreviewScale();
            });
            window.addEventListener('resize', () => {
                adjustPreviewScale();
            });

            // 表頭與勝者輸入
            document.getElementById('inp-date').addEventListener('input', (e) => {
                appState.header.date = e.target.value;
                renderPreviewTable();
            });
            document.getElementById('inp-team-a').addEventListener('input', (e) => {
                appState.header.teamA = e.target.value;
                renderActiveRoundEditor();
                renderPreviewTable();
            });
            document.getElementById('inp-team-b').addEventListener('input', (e) => {
                appState.header.teamB = e.target.value;
                renderActiveRoundEditor();
                renderPreviewTable();
            });
            document.getElementById('inp-stage').addEventListener('input', (e) => {
                appState.header.stage = e.target.value;
                renderPreviewTable();
            });
            document.getElementById('inp-winner').addEventListener('input', (e) => {
                appState.footer.winner = e.target.value;
                renderPreviewTable();
            });
            document.getElementById('btn-win-a').addEventListener('click', () => {
                appState.footer.winner = appState.header.teamA.trim() !== '' ? appState.header.teamA : '隊伍 A';
                appState.settings.winnerColorOverride = 'A';
                document.getElementById('inp-winner').value = appState.footer.winner;
                document.getElementById('opt-winner-color-override').value = 'A';
                renderPreviewTable();
            });
            document.getElementById('btn-win-b').addEventListener('click', () => {
                appState.footer.winner = appState.header.teamB.trim() !== '' ? appState.header.teamB : '隊伍 B';
                appState.settings.winnerColorOverride = 'B';
                document.getElementById('inp-winner').value = appState.footer.winner;
                document.getElementById('opt-winner-color-override').value = 'B';
                renderPreviewTable();
            });
            document.getElementById('inp-final-a').addEventListener('input', (e) => {
                appState.settings.autoCalculateScore = false;
                document.getElementById('chk-auto-score').checked = false;
                appState.footer.finalScoreA = e.target.value;
                renderPreviewTable();
            });
            document.getElementById('inp-final-b').addEventListener('input', (e) => {
                appState.settings.autoCalculateScore = false;
                document.getElementById('chk-auto-score').checked = false;
                appState.footer.finalScoreB = e.target.value;
                renderPreviewTable();
            });

            // 新增與移除局數 (支援 BO3 / BO5 加賽)
            document.getElementById('btn-add-round').addEventListener('click', () => {
                const nextNum = appState.rounds.length + 1;
                appState.rounds.push({
                    roundNumber: nextNum,
                    roundScoreA: '',
                    roundScoreB: '',
                    roundWinnerOverride: 'auto',
                    halves: [
                        {
                            halfName: '上',
                            mapPick: '',
                            mapBan: '',
                            teamARole: 'survivor',
                            emptyStyle: 'full-placeholder',
                            survivorsPick: ['', '', '', ''],
                            survivorsBan: ['', '', '', ''],
                            hunterPick: '',
                            hunterPlayer: '',
                            huntersBan: ['', ''],
                            showHunterBanLine: true,
                            hunterBanTemplate: 'Ban:/',
                            scoreA: '',
                            scoreB: ''
                        },
                        {
                            halfName: '下',
                            mapPick: '',
                            mapBan: '',
                            teamARole: 'hunter',
                            emptyStyle: 'full-placeholder',
                            survivorsPick: ['', '', '', ''],
                            survivorsBan: ['', '', '', ''],
                            hunterPick: '',
                            hunterPlayer: '',
                            huntersBan: ['', ''],
                            showHunterBanLine: true,
                            hunterBanTemplate: 'Ban:/',
                            scoreA: '',
                            scoreB: ''
                        }
                    ]
                });
                activeRoundIndex = appState.rounds.length - 1;
                renderControlPanel();
                renderPreviewTable();
                showToast(`已新增第 ${nextNum} 局`);
            });

            document.getElementById('btn-remove-round').addEventListener('click', () => {
                if (appState.rounds.length <= 1) {
                    showToast('至少需保留 1 局比賽資料', 'error');
                    return;
                }
                appState.rounds.pop();
                activeRoundIndex = Math.min(activeRoundIndex, appState.rounds.length - 1);
                renderControlPanel();
                renderPreviewTable();
                showToast('已移除末局');
            });

            // 載入預設與實戰範本
            document.getElementById('btn-load-template').addEventListener('click', () => {
                appState = createTemplateState();
                activeRoundIndex = 0;
                renderControlPanel();
                renderPreviewTable();
                showToast('已重設為空白預設範本');
            });

            document.getElementById('btn-load-demo').addEventListener('click', () => {
                appState = createDemoState();
                activeRoundIndex = 0;
                renderControlPanel();
                renderPreviewTable();
                showToast('已載入實戰範例數據');
            });

            // 複製為 Google 試算表 TSV 格式
            document.getElementById('btn-copy-tsv').addEventListener('click', () => {
                const lines = [];
                appState.rounds.forEach(round => {
                    round.halves.forEach((half, hIdx) => {
                        const mapBanCol = hIdx === 0 ? (half.mapBan || '').replace(/\//g, ' ') : '';
                        const mapPickCol = hIdx === 0 ? (half.mapPick || '') : '';
                        const halfCol = half.halfName;
                        const sBan = [0, 1, 2, 3].map(i => half.survivorsBan[i] || '');
                        const sPick = [0, 1, 2, 3].map(i => half.survivorsPick[i] || '');
                        const hBan1 = half.huntersBan[0] || '';
                        const hBan2 = half.huntersBan[1] || '';
                        const hPick = half.hunterPick || '';

                        const row = [
                            mapBanCol,
                            mapPickCol,
                            halfCol,
                            ...sBan,
                            ...sPick,
                            hBan1,
                            hBan2,
                            hPick
                        ].join('\t');
                        lines.push(row);
                    });
                });

                const tsvText = lines.join('\n');
                const textarea = document.createElement('textarea');
                textarea.value = tsvText;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('已複製 Google 試算表分欄格式 (TSV)，可直接貼上試算表！', 'success');
                } catch (err) {
                    showToast('複製失敗，請手動複製', 'error');
                }
                document.body.removeChild(textarea);
            });

            // 核心高畫質圖片產生器：優先使用 modern-screenshot (原生瀏覽器 SVG 渲染，無文字位移與壓線問題)
            async function captureTablePngDataUrl() {
                const wrapper = document.getElementById('export-wrapper');
                const bgColor = appState.settings.theme === 'dark' ? '#1c1c1c' : '#ffffff';

                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                if (window.modernScreenshot && typeof window.modernScreenshot.domToPng === 'function') {
                    return await window.modernScreenshot.domToPng(wrapper, {
                        scale: 2,
                        backgroundColor: bgColor
                    });
                }

                // 備援方案
                const canvas = await html2canvas(wrapper, {
                    scale: 2,
                    backgroundColor: bgColor,
                    useCORS: true,
                    logging: false
                });
                return canvas.toDataURL('image/png');
            }

            // 下載高畫質 PNG 圖片
            document.getElementById('btn-export-png').addEventListener('click', async () => {
                const wrapper = document.getElementById('export-wrapper');
                const prevTransform = wrapper.style.transform;
                wrapper.style.transform = 'none';
                wrapper.classList.add('exporting');
                try {
                    showToast('正在產生高解析度 PNG 圖片...');
                    const dataUrl = await captureTablePngDataUrl();
                    const link = document.createElement('a');
                    const teamAFile = appState.header.teamA.trim() || '隊伍A';
                    const teamBFile = appState.header.teamB.trim() || '隊伍B';
                    const fileName = `${teamAFile}_vs_${teamBFile}_對局表.png`.replace(/[\\/:*?"<>|]/g, '_');
                    link.download = fileName;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast('PNG 圖片下載完成！', 'success');
                } catch (error) {
                    console.error(error);
                    showToast('匯出圖片時發生錯誤', 'error');
                } finally {
                    wrapper.classList.remove('exporting');
                    wrapper.style.transform = prevTransform;
                    adjustPreviewScale();
                }
            });

            // 複製圖片至系統剪貼簿
            document.getElementById('btn-copy-img').addEventListener('click', async () => {
                const wrapper = document.getElementById('export-wrapper');
                const prevTransform = wrapper.style.transform;
                wrapper.style.transform = 'none';
                wrapper.classList.add('exporting');
                try {
                    showToast('正在轉換圖片至剪貼簿...');
                    const dataUrl = await captureTablePngDataUrl();
                    const res = await fetch(dataUrl);
                    const blob = await res.blob();
                    try {
                        if (navigator.clipboard && window.ClipboardItem) {
                            const item = new ClipboardItem({ 'image/png': blob });
                            await navigator.clipboard.write([item]);
                            showToast('圖片已複製到剪貼簿！可直接 Ctrl+V 貼上', 'success');
                        } else {
                            showToast('您的瀏覽器環境限制剪貼簿寫入，請點擊「下載 PNG 圖片」', 'error');
                        }
                    } catch (clipErr) {
                        showToast('因瀏覽器權限限制無法直接複製圖片，請使用右側「下載 PNG 圖片」按鈕', 'error');
                    }
                } catch (error) {
                    console.error(error);
                    showToast('處理圖片時發生錯誤', 'error');
                } finally {
                    wrapper.classList.remove('exporting');
                    wrapper.style.transform = prevTransform;
                    adjustPreviewScale();
                }
            });

            // 下載完整單一 index.html 供上傳 GitHub Pages
            document.getElementById('btn-download-html').addEventListener('click', () => {
                const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('已下載 index.html，可直接上傳至您的 GitHub Repository！', 'success');
            });
        }

        // 啟動初始化
        window.addEventListener('DOMContentLoaded', () => {
            bindGlobalEvents();
            renderControlPanel();
            renderPreviewTable();
        });
    </script>
</body>
</html>
